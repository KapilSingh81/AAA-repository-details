<div class="!rounded-xl !bg-white !overflow-hidden">
    <div class="!flex !items-center !justify-between !px-4 !py-4 !border-b !border-slate-200">
        <h2 class="!text-xl !font-medium !text-slate-900 !mb-0">Validation Certificate</h2>
        <button (click)="onClose()" class="!p-1 !text-slate-900 hover:!bg-slate-100 !rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor" class="!w-5 !h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="!p-4">
        <div class="!grid !grid-cols-1 md:!grid-cols-2 !gap-x-6 !gap-y-4">
            <div>
                <label class="!block !text-base !text-slate-800 !mb-2">Project Name</label>
                <input type="text" [value]="editData?.name || ''" readonly
                    class="!w-full !rounded-md !border !border-slate-200 !bg-slate-100 !px-3 !py-2 !text-base !text-slate-800 !outline-none" />
            </div>

            <div>
                <label class="!block !text-base !text-slate-800 !mb-2">Client Name</label>
                <input type="text" [value]="editData?.client_name || ''" readonly
                    class="!w-full !rounded-md !border !border-slate-200 !bg-slate-100 !px-3 !py-2 !text-base !text-slate-800 !outline-none" />
            </div>

            <div>
                <label class="!block !text-base !text-slate-800 !mb-2">Digital Signature</label>
                <input #signatureInput type="file" accept="image/png,image/jpeg" class="!hidden"
                    (change)="onSignatureSelected($event)" />
                <div (click)="signatureInput.click()" (dragover)="onDragOver($event, 'signature')"
                    (dragleave)="onDragLeave('signature')" (drop)="onSignatureDrop($event)"
                    class="!flex !flex-col !items-center !justify-center !text-center !rounded-xl !border-2 !border-dashed !px-4 !py-6 !min-h-[106px] !cursor-pointer !transition-colors"
                    [ngClass]="
                        isSignatureDragging()
                            ? '!border-blue-500 !bg-blue-50'
                            : '!border-slate-300 hover:!border-blue-400'
                    ">
                    @if (signatureFile()) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="!w-6 !h-6 !text-emerald-600 !mb-1">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="!text-sm !font-medium !text-slate-800 !mb-0 !max-w-full !truncate">
                        {{ signatureFile()?.name }}
                    </p>
                    <button (click)="removeSignature($event)"
                        class="!text-xs !text-red-600 hover:!underline !mt-1">
                        Remove
                    </button>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="!w-5 !h-5 !text-slate-400 !mb-1">
                        <path fill-rule="evenodd"
                            d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0016.5 9h-1.875a1.875 1.875 0 01-1.875-1.875V5.25A3.75 3.75 0 009 1.5H5.625zM12.97 11.47a.75.75 0 011.06 0l2.25 2.25a.75.75 0 11-1.06 1.06l-.97-.97v3.69a.75.75 0 01-1.5 0v-3.69l-.97.97a.75.75 0 11-1.06-1.06l2.25-2.25z"
                            clip-rule="evenodd" />
                    </svg>
                    <p class="!text-base !text-slate-700 !mb-1">
                        <span class="!text-indigo-600 !font-medium">Browse</span> or drop file here
                    </p>
                    <p class="!text-sm !text-slate-400 !mb-0">PNG, JPEG</p>
                    }
                </div>
            </div>

            <div>
                <label class="!block !text-base !text-slate-800 !mb-2">Barcode / QR</label>
                <input #barcodeInput type="file" accept="image/png,image/jpeg" class="!hidden"
                    (change)="onBarcodeSelected($event)" />
                <div (click)="barcodeInput.click()" (dragover)="onDragOver($event, 'barcode')"
                    (dragleave)="onDragLeave('barcode')" (drop)="onBarcodeDrop($event)"
                    class="!flex !flex-col !items-center !justify-center !text-center !rounded-xl !border-2 !border-dashed !px-4 !py-6 !min-h-[106px] !cursor-pointer !transition-colors"
                    [ngClass]="
                        isBarcodeDragging()
                            ? '!border-blue-500 !bg-blue-50'
                            : '!border-slate-300 hover:!border-blue-400'
                    ">
                    @if (barcodeFile()) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="!w-6 !h-6 !text-emerald-600 !mb-1">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="!text-sm !font-medium !text-slate-800 !mb-0 !max-w-full !truncate">
                        {{ barcodeFile()?.name }}
                    </p>
                    <button (click)="removeBarcode($event)" class="!text-xs !text-red-600 hover:!underline !mt-1">
                        Remove
                    </button>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="!w-5 !h-5 !text-slate-400 !mb-1">
                        <path fill-rule="evenodd"
                            d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0016.5 9h-1.875a1.875 1.875 0 01-1.875-1.875V5.25A3.75 3.75 0 009 1.5H5.625zM12.97 11.47a.75.75 0 011.06 0l2.25 2.25a.75.75 0 11-1.06 1.06l-.97-.97v3.69a.75.75 0 01-1.5 0v-3.69l-.97.97a.75.75 0 11-1.06-1.06l2.25-2.25z"
                            clip-rule="evenodd" />
                    </svg>
                    <p class="!text-base !text-slate-700 !mb-1">
                        <span class="!text-indigo-600 !font-medium">Browse</span> or drop file here
                    </p>
                    <p class="!text-sm !text-slate-400 !mb-0">PNG, JPEG</p>
                    }
                </div>
            </div>
        </div>

        <div class="!flex !items-center !justify-end !gap-3 !mt-4">
            <button (click)="onSubmit()" [disabled]="isSubmitting() || (!signatureFile() && !barcodeFile())"
                class="!px-4 !py-2 !text-base !font-medium !bg-green-700 !text-white !rounded-md hover:!bg-green-800 disabled:!opacity-50 disabled:!cursor-not-allowed !flex !items-center !gap-2">
                @if (isSubmitting()) {
                <span class="!animate-spin !rounded-full !h-4 !w-4 !border-b-2 !border-white"></span>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="!w-4 !h-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                }
                Upload
            </button>
            <button (click)="onClear()" [disabled]="isSubmitting()"
                class="!px-4 !py-2 !text-base !font-medium !bg-red-500 !text-white !rounded-md hover:!bg-red-600 disabled:!opacity-50 disabled:!cursor-not-allowed">
                Clear
            </button>
        </div>
    </div>
</div>
